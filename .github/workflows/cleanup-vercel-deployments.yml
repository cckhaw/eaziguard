# After the production deployment for a push to main is READY on Vercel, delete all older
# Preview and Production deployments of the project.
#
# Triggered by the push itself (not by Vercel events, which this repo does not receive) and
# restricted to app/ because pushes that leave app/ unchanged are skipped by Vercel
# (ignoreCommand in app/vercel.json) and would never produce a deployment to wait for.
#
# One-time setup (Settings -> Secrets and variables -> Actions -> Secrets):
#   VERCEL_TOKEN        a Vercel access token (vercel.com/account/tokens), scoped to the team
#   VERCEL_PROJECT_ID   Project Settings -> General -> Project ID
#   VERCEL_TEAM_ID      Team Settings -> General -> Team ID (leave unset for a personal account)
name: Clean up old Vercel deployments

on:
  push:
    branches: [main]
    paths:
      - "app/**"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "List what would be deleted without deleting"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: vercel-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: scripts
      - name: Delete deployments older than the live production deployment
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TEAM_ID: ${{ secrets.VERCEL_TEAM_ID }}
          WAIT_FOR_SHA: ${{ github.event_name == 'push' && github.sha || '' }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'false' }}
        run: ./scripts/cleanup-vercel-deployments.sh
