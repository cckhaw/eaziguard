# After a production deployment on Vercel finishes successfully, delete all older
# Preview and Production deployments of the project.
#
# One-time setup (Settings -> Secrets and variables -> Actions -> Secrets):
#   VERCEL_TOKEN        a Vercel access token (vercel.com/account/tokens), scoped to the team
#   VERCEL_PROJECT_ID   Project Settings -> General -> Project ID
#   VERCEL_TEAM_ID      Team Settings -> General -> Team ID (leave unset for a personal account)
name: Clean up old Vercel deployments

on:
  deployment_status:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "List what would be deleted without deleting"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: vercel-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    # Vercel reports deployment_status events; act only on a finished production deploy.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.deployment_status.state == 'success' &&
       github.event.deployment_status.environment == 'Production')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: scripts
      - name: Delete deployments older than the live production deployment
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TEAM_ID: ${{ secrets.VERCEL_TEAM_ID }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'false' }}
        run: ./scripts/cleanup-vercel-deployments.sh
