# snmp_exporter configuration (hand-written, no generator step required).
#
# Run with --config.expand-environment-variables, so ${SNMP_COMMUNITY} is
# injected from the container environment instead of living in git.
#
# Exposes IF-MIB / EtherLike-MIB counters used by the switch, gateway and
# wireless-controller alerts. Every device that supports standard MIB-II works
# out of the box; vendor MIBs can be added as further modules.

auths:
  campus_v2:
    community: ${SNMP_COMMUNITY}
    security_level: noAuthNoPriv
    version: 2
  # SNMPv3 example (preferred in production). Add the variables to the
  # snmp-exporter service environment, then use `auth: [campus_v3]` in prometheus.yml.
  #
  # campus_v3:
  #   version: 3
  #   security_level: authPriv
  #   username: ${SNMPV3_USER}
  #   auth_protocol: SHA
  #   password: ${SNMPV3_AUTH_PASSWORD}
  #   priv_protocol: AES
  #   priv_password: ${SNMPV3_PRIV_PASSWORD}

modules:
  if_mib:
    retries: 2
    timeout: 10s
    walk:
      - 1.3.6.1.2.1.1.3          # sysUpTime
      - 1.3.6.1.2.1.2.2.1.2      # ifDescr
      - 1.3.6.1.2.1.2.2.1.5      # ifSpeed
      - 1.3.6.1.2.1.2.2.1.8      # ifOperStatus
      - 1.3.6.1.2.1.2.2.1.13     # ifInDiscards
      - 1.3.6.1.2.1.2.2.1.14     # ifInErrors
      - 1.3.6.1.2.1.2.2.1.19     # ifOutDiscards
      - 1.3.6.1.2.1.2.2.1.20     # ifOutErrors
      - 1.3.6.1.2.1.10.7.2.1.3   # dot3StatsFCSErrors (CRC)
      - 1.3.6.1.2.1.31.1.1.1.1   # ifName
      - 1.3.6.1.2.1.31.1.1.1.6   # ifHCInOctets
      - 1.3.6.1.2.1.31.1.1.1.10  # ifHCOutOctets
    metrics:
      - name: sysUpTime
        oid: 1.3.6.1.2.1.1.3
        type: gauge
        help: Time (in hundredths of a second) since the network management portion of the system was last re-initialized. - 1.3.6.1.2.1.1.3
      - name: ifSpeed
        oid: 1.3.6.1.2.1.2.2.1.5
        type: gauge
        help: An estimate of the interface's current bandwidth in bits per second - 1.3.6.1.2.1.2.2.1.5
        indexes: &if_indexes
          - labelname: ifIndex
            type: gauge
        lookups: &if_lookups
          - labels: [ifIndex]
            labelname: ifName
            oid: 1.3.6.1.2.1.31.1.1.1.1
            type: DisplayString
          - labels: [ifIndex]
            labelname: ifDescr
            oid: 1.3.6.1.2.1.2.2.1.2
            type: DisplayString
      - name: ifOperStatus
        oid: 1.3.6.1.2.1.2.2.1.8
        type: EnumAsStateSet
        help: The current operational state of the interface - 1.3.6.1.2.1.2.2.1.8
        indexes: *if_indexes
        lookups: *if_lookups
        enum_values:
          1: up
          2: down
          3: testing
          4: unknown
          5: dormant
          6: notPresent
          7: lowerLayerDown
      - name: ifInDiscards
        oid: 1.3.6.1.2.1.2.2.1.13
        type: counter
        help: Inbound packets discarded even though no errors were detected - 1.3.6.1.2.1.2.2.1.13
        indexes: *if_indexes
        lookups: *if_lookups
      - name: ifInErrors
        oid: 1.3.6.1.2.1.2.2.1.14
        type: counter
        help: Inbound packets that contained errors - 1.3.6.1.2.1.2.2.1.14
        indexes: *if_indexes
        lookups: *if_lookups
      - name: ifOutDiscards
        oid: 1.3.6.1.2.1.2.2.1.19
        type: counter
        help: Outbound packets discarded even though no errors were detected - 1.3.6.1.2.1.2.2.1.19
        indexes: *if_indexes
        lookups: *if_lookups
      - name: ifOutErrors
        oid: 1.3.6.1.2.1.2.2.1.20
        type: counter
        help: Outbound packets that could not be transmitted because of errors - 1.3.6.1.2.1.2.2.1.20
        indexes: *if_indexes
        lookups: *if_lookups
      - name: dot3StatsFCSErrors
        oid: 1.3.6.1.2.1.10.7.2.1.3
        type: counter
        help: Frames received that are an integral number of octets in length but do not pass the FCS check (CRC errors) - 1.3.6.1.2.1.10.7.2.1.3
        indexes:
          - labelname: dot3StatsIndex
            type: gauge
        lookups:
          - labels: [dot3StatsIndex]
            labelname: ifName
            oid: 1.3.6.1.2.1.31.1.1.1.1
            type: DisplayString
          - labels: [dot3StatsIndex]
            labelname: ifDescr
            oid: 1.3.6.1.2.1.2.2.1.2
            type: DisplayString
      - name: ifHCInOctets
        oid: 1.3.6.1.2.1.31.1.1.1.6
        type: counter
        help: The total number of octets received on the interface, including framing characters - 1.3.6.1.2.1.31.1.1.1.6
        indexes: *if_indexes
        lookups: *if_lookups
      - name: ifHCOutOctets
        oid: 1.3.6.1.2.1.31.1.1.1.10
        type: counter
        help: The total number of octets transmitted out of the interface, including framing characters - 1.3.6.1.2.1.31.1.1.1.10
        indexes: *if_indexes
        lookups: *if_lookups
